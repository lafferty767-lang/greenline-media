name: Post to Instagram

on:
  # Paused Oct 30 2026: Logan schedules Reels in the Instagram app instead (Meta's new apps need extra setup).
  # To turn daily posting back on, add IG_TOKEN and restore:
  # schedule:
  #   - cron: "0 2 * * *"   # 02:00 UTC = 6 pm Pacific in winter, 7 pm in summer
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare the Reel but don't publish it"
        type: boolean
        default: true
      post_date:
        description: "Schedule date to use (YYYY-MM-DD), blank for today"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Post today's Reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POST_DATE: ${{ inputs.post_date }}
        run: python3 poster/post_instagram.py

      - name: Remember what was posted
        run: |
          if ! git diff --quiet schedule/posted.json; then
            git config user.name "greenline-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule/posted.json
            git commit -m "Record Instagram post"
            git push
          fi
