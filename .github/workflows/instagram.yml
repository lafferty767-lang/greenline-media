name: Post to Instagram

on:
  schedule:
    # Every two hours: GitHub starts scheduled runs late and skips many. A run in the 5.5 hours
    # before 6 pm Pacific waits and posts at 6 pm; a later run posts right away; others do nothing.
    # Without the IG_TOKEN secret the run just notes that and posts nothing.
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare the Reel but don't publish it"
        type: boolean
        default: true
      post_date:
        description: "Schedule date to use (YYYY-MM-DD), blank for today"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Post today's Reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POST_DATE: ${{ inputs.post_date }}
          POST_AT: "18:00"
          MAX_WAIT_HOURS: "5.5"
          POST_NOW: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 poster/post_instagram.py

      - name: Remember what was posted
        run: |
          if ! git diff --quiet schedule/posted.json; then
            git config user.name "greenline-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule/posted.json
            git commit -m "Record Instagram post"
            git pull --rebase -q origin main
            git push
          fi
