name: Post to TikTok, YouTube + Facebook

on:
  schedule:
    # Every two hours: GitHub sometimes starts scheduled runs hours late. The first run of the day
    # asks Buffer to publish at 6 pm Pacific; the other runs that day do nothing.
    # Without the BUFFER_API_KEY secret the run just notes that and posts nothing.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check everything with a Buffer draft, publish nothing"
        type: boolean
        default: true
      post_date:
        description: "Schedule date to use (YYYY-MM-DD), blank for today"
        required: false

permissions:
  contents: write

concurrency:
  group: buffer-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Post today's videos
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POST_DATE: ${{ inputs.post_date }}
          POST_AT: "18:00"
          POST_NOW: ${{ github.event_name == 'workflow_dispatch' }}
          YOUTUBE_MADE_FOR_KIDS: "true"
        run: python3 poster/post_buffer.py

      - name: Remember what was posted
        if: always()
        run: |
          if ! git diff --quiet schedule/buffer-posted.json; then
            git config user.name "greenline-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule/buffer-posted.json
            git commit -m "Record Buffer posts"
            git pull --rebase -q origin main
            git push
          fi
