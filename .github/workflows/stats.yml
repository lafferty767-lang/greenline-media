name: Collect video stats

on:
  schedule:
    # Once a day, mid-morning Pacific. Read-only: it never posts anything.
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect the numbers
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 poster/stats.py

      - name: Save them
        run: |
          if [ -n "$(git status --porcelain stats)" ]; then
            git config user.name "greenline-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats
            git commit -m "Update video stats"
            git pull --rebase -q origin main
            git push
          fi
